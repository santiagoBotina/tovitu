      body: '%{adopter_name} has submitted an adoption request for %{pet_name}.'
      review: Review the request and respond from your dashboard.
      view_request: Review Request
    request_withdrawn:
      subject: "%{adopter_name} withdrew their request for %{pet_name}"
      greeting: Hi %{recipient_name},
      body: '%{adopter_name} has withdrawn their adoption request for %{pet_name}.'
      next_steps: '%{pet_name} is now available for other adopters. You can check your dashboard for updates.'
