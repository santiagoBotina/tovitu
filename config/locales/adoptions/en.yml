        submitted: Your adoption request has been submitted successfully!
        updated: The adoption request has been updated.
        declined: The adoption request has been declined.
        withdrawn: Your adoption request has been withdrawn successfully.

      timeline:
        pending: Request submitted
        in_validation: Shelter is reviewing the request
        accepted: Request accepted — pet on hold
        declined: Request declined
        withdrawn: Request withdrawn by adopter

