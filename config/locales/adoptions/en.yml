        questionnaire_section: Questionnaire
        submit: Submit Application
        cancel: Cancel
        processing: Submitting...

    mailer:
      confirmation:
        subject: "Adoption Application Confirmed — %{reference}"
        greeting: Hi %{name},
        body: Thank you for applying to adopt %{pet_name}! Your application has been received and is being reviewed by the shelter.
        reference: Your reference number is %{reference}.
        check_status: Check Application Status
        shelter_reply: The shelter will review your application and contact you if they need more information.
        thanks: Thank you for choosing to adopt!
      approved:
        subject: "Great news! Your application has been approved!"
        greeting: Hi %{name},
        body: Your application to adopt %{pet_name} has been approved! The pet has been placed on hold for you.
        next_steps: The shelter will contact you to arrange the next steps, including a meet-and-greet.
        hold_info: Please note that the hold on %{pet_name} will expire in 48 hours.
      rejected:
        subject: Update on your adoption application
        greeting: Hi %{name},
        body: Unfortunately, your application to adopt %{pet_name} has been reviewed and we are unable to move forward at this time.
        reason: "Reason: %{reason}"
        encouragement: We encourage you to explore other pets who might be a great match for you.
      info_requested:
        subject: Additional information needed for your application
        greeting: Hi %{name},
        body: The shelter has reviewed your application and needs some additional information to proceed.
        questions: "They have asked the following:"
        respond: Please respond to the shelter directly with the requested information.
      info_received:
        subject: Your response has been received
        greeting: Hi %{name},
        body: Thank you for providing the additional information.
      completed:
        subject: Congratulations on your adoption!
        greeting: Congratulations %{name}!
        body: Your adoption of %{pet_name} has been finalized. Welcome to your new family member!
      withdrawn:
        subject: Application withdrawn — %{pet_name}
        greeting: Hello Shelter Team,
        body: "%{name} (%{email}) has withdrawn their application for %{pet_name}."
      cancelled:
        subject: Update on your adoption application
        greeting: Hi %{name},
        body: Unfortunately, your adoption of %{pet_name} has been cancelled.
        reason: "Reason: %{reason}"
        contact: If you have questions, please contact the shelter directly.
      expired:
        subject: "Adoption hold expired — %{pet_name}"
        greeting: Hi %{name},
        body: The hold period for %{pet_name} has expired. The pet is now available for other adopters.
        contact: If you are still interested, please contact the shelter.

