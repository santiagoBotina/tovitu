      settings:
        title: Evaluación automática
        subtitle: Evalúa las solicitudes entrantes con reglas de seguridad del sistema y reglas traducidas de tus políticas. Los veredictos son informativos — la decisión final siempre es tuya.
        add_policy_title: Agregar una política
        add_policy_hint: Escribe cada política en su propia línea. Propondremos reglas que puedes revisar, editar, activar o descartar.
        add_policy_placeholder: p. ej. Los solicitantes deben tener jardín cercado
        add_policy_submit: Guardar y traducir
        translate_all: Traducir mis políticas
