      reasons_title: "Motivo"
      view_request: "Ver Tu Solicitud"
      contact: "Si tienes preguntas, contacta directamente a %{party_name}."
    new_request_notification:
      subject: "Nueva solicitud de adopción para %{pet_name}"
      greeting: "Hola %{name},"
      body: "%{adopter_name} ha enviado una solicitud de adopción para %{pet_name}."
      review: "Revisa la solicitud y responde desde tu panel de control."
      view_request: "Revisar Solicitud"
    request_withdrawn:
      subject: "%{adopter_name} retiró su solicitud para %{pet_name}"
      greeting: "Hola %{recipient_name},"
      body: "%{adopter_name} ha retirado su solicitud de adopción para %{pet_name}."
      next_steps: "%{pet_name} ahora está disponible para otros adoptantes. Puedes revisar tu panel de control para más actualizaciones."
      view_request: "Ver Solicitud"
      thanks: "¡Gracias por usar Tovitu!"

