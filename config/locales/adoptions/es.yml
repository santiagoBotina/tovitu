        not_evaluated_hint: Todavía no podemos verificar estas políticas automáticamente. Se siguen mostrando a los adoptantes pero nunca afectan un veredicto.
        reasons:
          unsupported_data: Todavía no podemos verificar esto automáticamente.
          not_screening: No es un requisito de selección que podamos evaluar.
        failed_title: Falló la traducción
        failed_hint: No pudimos traducir esta política en este momento. Tu texto está guardado — inténtalo de nuevo.
        retry: Reintentar traducción
        system_rules_title: Reglas del sistema (siempre activas)
        system_rules_hint: Estas reglas de seguridad de la plataforma se ejecutan en cada solicitud. Los umbrales los gestiona la plataforma y no se pueden editar por refugio.
        no_policies_title: Aún no hay políticas de evaluación
        no_policies_hint: Agrega políticas en lenguaje natural y tradúcelas a reglas que tú controles.
        no_rules_title: Aún no hay reglas traducidas
        no_rules_hint: Agrega políticas arriba y luego tradúcelas a reglas revisables.
        translated_count:
          one: "%{count} regla"
          other: "%{count} reglas"
      errors:
        policy_blank: La política no puede estar vacía.
        no_rules: No se pudieron evaluar reglas para esta solicitud.
        not_authorized: No estás autorizado para gestionar las políticas de evaluación.
      flash:
        re_run_success: La verificación se volvió a ejecutar con el perfil actual del adoptante.
        policies_translated: "Políticas traducidas. Revisa las reglas propuestas a continuación."
        policies_failed: No pudimos traducir tus políticas en este momento. Tu texto está guardado — inténtalo de nuevo.
        policy_added: Política agregada. Sus reglas propuestas aparecen a continuación.
