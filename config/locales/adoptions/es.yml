es:
  adoption_mailer:
    request_confirmation:
      subject: "Solicitud para adoptar a %{pet_name} — Confirmación"
      greeting: "Hola %{name},"
      body: "¡Gracias por tu interés en adoptar a %{pet_name}! Tu solicitud ha sido enviada a %{party_name} para revisión."
      next_steps: "El publicador revisará tu perfil y se pondrá en contacto contigo pronto."
      view_request: "Ver Tu Solicitud"
      thanks: "¡Gracias por elegir adoptar!"
    status_changed:
      subject: "Actualización sobre tu solicitud para adoptar a %{pet_name}"
      greeting: "Hola %{name},"
