        daily_time_available_min:
          label: Tiempo diario disponible
          description: El adoptante debe tener al menos el tiempo diario requerido disponible.
        adoption_priority_present:
          label: Motivación para adoptar
          description: El adoptante debe indicar por qué quiere adoptar.
        additional_answers_present:
          label: Respuestas de la solicitud
          description: El adoptante debe responder las preguntas de la solicitud.
        no_prior_decline_same_pet:
          label: Sin declinación previa de esta mascota
          description: El adoptante no debe tener una solicitud previa declinada o retirada para esta mascota.
