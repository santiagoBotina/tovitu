test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Development/test storage backed by LocalStack S3. Endpoint and credentials
# come from the shared AWS config (see config/initializers/aws.rb) via ENV —
# the same values the rest of the app uses.
localstack:
  service: S3
  endpoint: <%= ENV["AWS_ENDPOINT_URL"] %>
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("AWS_REGION", "us-east-1") %>
  bucket: <%= ENV.fetch("S3_BUCKET", "tovitu-development") %>
  force_path_style: true

# Production storage on real Amazon S3. With no static credentials set, the
# SDK falls back to the instance/IAM role credential chain.
amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("AWS_REGION", "us-east-1") %>
  bucket: <%= ENV.fetch("S3_BUCKET", "tovitu-production") %>
