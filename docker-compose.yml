services:
  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tovitu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tovitu_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tovitu_development}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tovitu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack is the local equivalent of every AWS service the app uses
  # (S3 storage, SQS jobs, SES email, Cognito auth, Secrets Manager,
  # EventBridge Scheduler). Run `bin/rails queuing:work` to consume job queues.
  localstack:
    # Community by default. To unlock Pro-only services (cognito-idp, sesv2)
    # and persistence, set LOCALSTACK_IMAGE=localstack/localstack-pro:4 and
    # LOCALSTACK_AUTH_TOKEN in .env.
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:4}
    volumes:
      - localstack_data:/var/lib/localstack
      # Repo `.localstack/` maps directly to LocalStack's init-ready.d hook dir.
      # Numbered `NN-*.sh` scripts there provision resources on boot; generated
      # state (e.g. Cognito pool ids) is written to `.localstack/state/`.
      - "${LOCALSTACK_VOLUME:-./.localstack}:/etc/localstack/init/ready.d"
    environment:
      # Every AWS service LocalStack emulates for the migration (s3, sqs, sns,
      # ses + sesv2, cognito-idp, secretsmanager, logs, events, scheduler).
      SERVICES: s3,sqs,sns,ses,sesv2,cognito-idp,secretsmanager,logs,events,scheduler
      PERSISTENCE: 1
      # Optional LocalStack student/Pro license. Without it, Pro-only services
      # (cognito-idp, sesv2) are skipped gracefully; PERSISTENCE also requires it.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${LOCALSTACK_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${LOCALSTACK_SECRET_KEY:-test}
      EDGE_PORT: 4566
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      # "Ready" requires the init hooks (ready.d) to have finished, not just
      # the services to be reachable — otherwise resources (queues, topics,
      # secrets, schedules) appear missing to aws:smoke.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | python3 -c \"import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('completed') is True else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  localstack_data:
