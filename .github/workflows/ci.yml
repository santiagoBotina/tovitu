name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: tovitu
      DB_PASSWORD: tovitu_dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run test suite
        run: bundle exec rspec

  aws_localstack:
    runs-on: ubuntu-latest
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: tovitu-development
      SQS_QUEUE_PREFIX: tovitu
      # Optional: set LOCALSTACK_AUTH_TOKEN as a repo secret to validate the
      # Pro-only footprint (cognito-idp, sesv2) in CI. Empty otherwise.
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Start LocalStack
        run: |
          if [ -n "${{ secrets.LOCALSTACK_AUTH_TOKEN }}" ]; then
            echo "LOCALSTACK_IMAGE=localstack/localstack-pro:4" >> "$GITHUB_ENV"
          fi
          docker compose up -d localstack

      - name: Wait for LocalStack health
        run: |
          # Core services must be up AND the init hooks (ready.d) must have
          # finished provisioning resources, otherwise aws:smoke races ahead
          # and reports SQS/SNS/Secrets/Scheduler as missing.
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4566/_localstack/health 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); s=d.get('services',{}); sys.exit(0 if all(s.get(k) in ('available','running') for k in ['s3','sqs','sns','ses','secretsmanager','logs','events','scheduler']) else 1)" \
              && curl -sf http://localhost:4566/_localstack/init/ready 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('completed') is True else 1)"; then
              echo "LocalStack ready: core services up and init hooks completed"
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack did not become ready (core services up + init hooks completed)" >&2
          exit 1

      - name: Verify AWS emulation footprint
        run: bin/rails aws:smoke

